name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Drop the default GITHUB_TOKEN to read-only; nothing here writes via it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Lint jobs (fast, Linux-only)
# ---------------------------------------------------------------------------

jobs:
  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source must be ASCII-only
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.hs' '*.cabal' '*.md' '*.yml'; then
            echo "Non-ASCII characters found above; keep the source ASCII-only (no smart quotes, em-dashes, or Unicode arrows)."
            exit 1
          fi

  lint:
    name: HLint
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/"]'
          fail-on: warning

  format:
    name: Ormolu
    needs: [ascii]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-ormolu@v19
        with:
          # Formatting is not stable across ormolu releases; keep this
          # pinned in lockstep with the local binary.
          version: "0.8.0.2"
          pattern: |
            src/**/*.hs
            test/**/*.hs

  # ---------------------------------------------------------------------------
  # Packaging check (Linux-only)
  # ---------------------------------------------------------------------------

  cabal-check:
    name: Cabal Check
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'
      - run: cabal check

  # ---------------------------------------------------------------------------
  # Build + Test (cross-platform matrix)
  # ---------------------------------------------------------------------------

  build:
    name: Build (${{ matrix.name }})
    needs: [lint, format, cabal-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('firebase-hs.cabal') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Haddock
        run: cabal haddock -f wai -f servant

      # Both flags plus --enable-tests: the flags default to off, so a
      # plain `cabal build` never compiles Firebase.Auth.WAI or
      # Firebase.Servant.
      - name: Build
        run: cabal build all -f wai -f servant --enable-tests --ghc-options="-Werror"

      - name: Test
        run: cabal test -f wai -f servant --ghc-options="-Werror"

  # ---------------------------------------------------------------------------
  # GHC compatibility (Linux-only). Boot-library bounds are only exercised
  # by the GHC that ships each version, so every compiler in tested-with
  # must build here. 9.8 is covered by the build matrix above, which runs a
  # superset of this job.
  # ---------------------------------------------------------------------------

  ghc-compat:
    name: GHC ${{ matrix.ghc }}
    needs: [lint, format, cabal-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6', '9.10', '9.12']
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-ghc${{ matrix.ghc }}-${{ hashFiles('firebase-hs.cabal') }}
          restore-keys: cabal-ghc${{ matrix.ghc }}-

      - name: Build and test
        run: cabal build all --enable-tests --ghc-options="-Werror"

      - name: Test
        run: cabal test

  # ---------------------------------------------------------------------------
  # Build from the sdist tarball, exactly as a Hackage user does
  # (Linux-only). Catches divergence between the git tree and the tarball,
  # such as files missing from the sdist.
  # ---------------------------------------------------------------------------

  sdist:
    name: Build from sdist
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-sdist-${{ hashFiles('firebase-hs.cabal') }}
          restore-keys: cabal-sdist-

      - name: Build the tarball a Hackage user gets
        run: |
          cabal sdist -o "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/sdist/firebase-hs-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/firebase-hs-*/
          cabal build all -f wai -f servant --enable-tests
